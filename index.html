<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>盆栽 — hakoniwa</title>
<style>
  :root {
    --sky-top: #cfe3e8;
    --sky-bottom: #f4ede1;
    --pot: #a85c3f;
    --pot-dark: #8a4a32;
    --soil: #4a372b;
    --soil-dark: #362820;
    --sprout: #6b9a4f;
    --sprout-dark: #4f7a38;
    --cotyledon: #8fa868;
    --leaf: #3f7a3a;
    --ink: #3a3229;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: linear-gradient(to bottom, var(--sky-top), var(--sky-bottom));
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    color: var(--ink);
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    padding: 2rem 1rem;
  }
  .stage {
    width: min(90vw, 420px);
  }
  .caption {
    text-align: center;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    color: var(--ink);
    opacity: 0.6;
  }
  .caption .day {
    font-weight: bold;
    opacity: 1;
  }
  #sprout {
    transform-origin: 200px 300px;
    animation: sway 6s ease-in-out infinite;
  }
  @keyframes sway {
    0%, 100% { transform: rotate(-1.2deg); }
    50% { transform: rotate(1.2deg); }
  }
</style>
</head>
<body>
  <!-- BONSAI STAGE: 2 (本葉が出た) -->
  <div class="stage">
    <svg viewBox="0 0 400 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="鉢の土から伸びた若い芽。双葉の上に、最初の本葉が一対ひらいている盆栽の絵">
      <!-- pot -->
      <path d="M 130 260 L 270 260 L 250 320 L 150 320 Z" fill="var(--pot)" />
      <path d="M 150 320 L 250 320 L 246 330 L 154 330 Z" fill="var(--pot-dark)" />
      <rect x="120" y="248" width="160" height="16" rx="4" fill="var(--pot-dark)" />
      <!-- soil -->
      <ellipse cx="200" cy="252" rx="72" ry="14" fill="var(--soil)" />
      <ellipse cx="200" cy="250" rx="72" ry="12" fill="var(--soil-dark)" opacity="0.4" />
      <!-- cracked seed husk -->
      <path d="M 176 246 q 6 -8 12 0" stroke="var(--soil-dark)" stroke-width="2" fill="none" stroke-linecap="round" />

      <!-- sprout -->
      <g id="sprout">
        <!-- stem: 双葉の位置から上へ少し伸びた -->
        <path d="M 200 250 C 198 236 200 224 200 214 C 200 204 199 196 201 186" stroke="var(--sprout-dark)" stroke-width="3" fill="none" stroke-linecap="round" />
        <!-- cotyledons (双葉): 役目を終えつつあり、わずかに色が褪せて垂れはじめた -->
        <path d="M 200 220 C 186 218 175 226 171 236 C 183 237 194 232 200 220 Z" fill="var(--cotyledon)" />
        <path d="M 200 220 C 214 216 226 221 231 231 C 219 235 208 231 200 220 Z" fill="var(--cotyledon)" />
        <!-- true leaves (本葉): 縁にかすかな鋸歯をもつ、小さな最初の一対 -->
        <g id="true-leaves">
          <path d="M 201 188 C 195 182 186 180 180 182 L 182 179 L 179 177 C 186 172 196 176 201 188 Z" fill="var(--leaf)" />
          <path d="M 201 188 C 207 180 216 175 223 177 L 220 179 L 223 182 C 216 186 207 188 201 188 Z" fill="var(--leaf)" />
          <path d="M 201 188 L 186 180 M 201 188 L 217 178" stroke="var(--sprout-dark)" stroke-width="0.8" opacity="0.5" fill="none" />
        </g>
      </g>
    </svg>
  </div>
  <p class="caption">day <span class="day">2</span> — 双葉の上に、最初の本葉がひらいた。</p>
</body>
</html>
