<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>盆栽 — hakoniwa</title>
<style>
  :root {
    --sky-top: #cfe3e8;
    --sky-bottom: #f4ede1;
    --pot: #a85c3f;
    --pot-dark: #8a4a32;
    --soil: #4a372b;
    --soil-dark: #362820;
    --sprout: #6b9a4f;
    --sprout-dark: #4f7a38;
    --ink: #3a3229;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: linear-gradient(to bottom, var(--sky-top), var(--sky-bottom));
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    color: var(--ink);
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    padding: 2rem 1rem;
  }
  .stage {
    width: min(90vw, 420px);
  }
  .caption {
    text-align: center;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    color: var(--ink);
    opacity: 0.6;
  }
  .caption .day {
    font-weight: bold;
    opacity: 1;
  }
  #sprout {
    transform-origin: 200px 300px;
    animation: sway 6s ease-in-out infinite;
  }
  @keyframes sway {
    0%, 100% { transform: rotate(-1.2deg); }
    50% { transform: rotate(1.2deg); }
  }
</style>
</head>
<body>
  <!-- BONSAI STAGE: 2 (本葉が出た) -->
  <div class="stage">
    <svg viewBox="0 0 400 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="鉢の土から茎が伸び、双葉の上に本葉が顔を出した盆栽の絵">
      <!-- pot -->
      <path d="M 130 260 L 270 260 L 250 320 L 150 320 Z" fill="var(--pot)" />
      <path d="M 150 320 L 250 320 L 246 330 L 154 330 Z" fill="var(--pot-dark)" />
      <rect x="120" y="248" width="160" height="16" rx="4" fill="var(--pot-dark)" />
      <!-- soil -->
      <ellipse cx="200" cy="252" rx="72" ry="14" fill="var(--soil)" />
      <ellipse cx="200" cy="250" rx="72" ry="12" fill="var(--soil-dark)" opacity="0.4" />
      <!-- cracked seed husk -->
      <path d="M 176 246 q 6 -8 12 0" stroke="var(--soil-dark)" stroke-width="2" fill="none" stroke-linecap="round" />

      <!-- sprout -->
      <g id="sprout">
        <path d="M 200 250 C 197 232 201 212 200 190" stroke="var(--sprout-dark)" stroke-width="3.5" fill="none" stroke-linecap="round" />
        <!-- cotyledons (双葉) -->
        <path d="M 200 222 C 184 218 172 224 168 235 C 182 238 194 233 200 222 Z" fill="var(--sprout-dark)" />
        <path d="M 200 222 C 216 216 229 220 234 231 C 220 235 208 231 200 222 Z" fill="var(--sprout-dark)" />
        <!-- true leaves (本葉) -->
        <path d="M 200 196 C 186 186 180 172 184 160 C 196 164 203 178 200 196 Z" fill="var(--sprout)" />
        <path d="M 200 196 C 214 188 224 176 222 164 C 210 166 200 178 200 196 Z" fill="var(--sprout)" />
        <path d="M 200 190 C 197 178 199 168 200 160 C 203 170 203 180 200 190 Z" fill="var(--sprout)" />
      </g>
    </svg>
  </div>
  <p class="caption">day <span class="day">2</span> — 双葉の上に、本葉がひらいた。</p>
</body>
</html>
