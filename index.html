<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>盆栽 — hakoniwa</title>
<style>
  :root {
    --sky-top: #cfe3e8;
    --sky-bottom: #f4ede1;
    --pot: #a85c3f;
    --pot-dark: #8a4a32;
    --soil: #4a372b;
    --soil-dark: #362820;
    --sprout: #6b9a4f;
    --sprout-dark: #4f7a38;
    --ink: #3a3229;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: linear-gradient(to bottom, var(--sky-top), var(--sky-bottom));
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    color: var(--ink);
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    padding: 2rem 1rem;
  }
  .stage {
    width: min(90vw, 420px);
  }
  .caption {
    text-align: center;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    color: var(--ink);
    opacity: 0.6;
  }
  .caption .day {
    font-weight: bold;
    opacity: 1;
  }
  #sprout {
    transform-origin: 200px 300px;
    animation: sway 6s ease-in-out infinite;
  }
  @keyframes sway {
    0%, 100% { transform: rotate(-1.2deg); }
    50% { transform: rotate(1.2deg); }
  }
</style>
</head>
<body>
  <!-- BONSAI STAGE: 2 (本葉が出た) -->
  <div class="stage">
    <svg viewBox="0 0 400 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="鉢の土から茎が伸び、双葉の上に本葉が開いた盆栽の絵">
      <!-- pot -->
      <path d="M 130 260 L 270 260 L 250 320 L 150 320 Z" fill="var(--pot)" />
      <path d="M 150 320 L 250 320 L 246 330 L 154 330 Z" fill="var(--pot-dark)" />
      <rect x="120" y="248" width="160" height="16" rx="4" fill="var(--pot-dark)" />
      <!-- soil -->
      <ellipse cx="200" cy="252" rx="72" ry="14" fill="var(--soil)" />
      <ellipse cx="200" cy="250" rx="72" ry="12" fill="var(--soil-dark)" opacity="0.4" />
      <!-- cracked seed husk -->
      <path d="M 176 246 q 6 -8 12 0" stroke="var(--soil-dark)" stroke-width="2" fill="none" stroke-linecap="round" />

      <!-- sprout -->
      <g id="sprout">
        <!-- 茎: 双葉の上へ少し伸びた -->
        <path d="M 200 250 C 198 232 202 210 200 188" stroke="var(--sprout-dark)" stroke-width="3.5" fill="none" stroke-linecap="round" />
        <!-- 双葉(下の一対) -->
        <path d="M 200 222 C 186 218 176 224 172 234 C 184 236 194 232 200 222 Z" fill="var(--sprout)" />
        <path d="M 200 222 C 214 216 226 220 231 230 C 219 234 208 230 200 222 Z" fill="var(--sprout)" />
        <!-- 本葉(最初の一対): 双葉より小さく、少し濃い -->
        <path d="M 200 196 C 190 188 182 190 178 198 C 187 202 195 202 200 196 Z" fill="var(--sprout-dark)" />
        <path d="M 200 196 C 210 186 219 188 223 196 C 214 201 206 201 200 196 Z" fill="var(--sprout-dark)" />
        <!-- 頂芽 -->
        <path d="M 200 188 C 196 180 198 174 200 170 C 202 174 204 180 200 188 Z" fill="var(--sprout)" />
      </g>
    </svg>
  </div>
  <p class="caption">day <span class="day">2</span> — 双葉の上に、最初の本葉が開いた。</p>
</body>
</html>
