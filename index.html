<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>庭</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    background: #10182c;
  }

  #sky {
    position: fixed;
    inset: 0;
    transition: background 4s ease;
  }

  #celestial {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }

  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: #fff;
    transition: opacity 4s ease;
  }

  #sun, #moon {
    position: absolute;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    transition: opacity 3s ease;
    will-change: left, top;
  }

  #sun {
    background: radial-gradient(circle at 35% 35%, #fff6d8, #ffd166 55%, #f6a83c 100%);
    box-shadow: 0 0 40px 12px rgba(255, 209, 102, 0.45);
  }

  #moon {
    background: radial-gradient(circle at 35% 35%, #fdfdfe, #d9dfe8 60%, #b7bfcc 100%);
    box-shadow: 0 0 24px 6px rgba(217, 223, 232, 0.35);
  }

  #scene {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    height: 42vh;
    display: block;
  }

  #hill { fill: url(#hillGradient); }
  #soil { fill: url(#soilGradient); }

  #day-counter {
    position: fixed;
    right: 14px;
    bottom: 10px;
    font-size: 12px;
    letter-spacing: 0.05em;
    color: rgba(255, 255, 255, 0.55);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    user-select: none;
  }

  #garden-label {
    position: fixed;
    left: 16px;
    top: 14px;
    font-size: 13px;
    letter-spacing: 0.2em;
    color: rgba(255, 255, 255, 0.5);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    user-select: none;
  }
</style>
</head>
<body>

<div id="sky">
  <div id="celestial">
    <div id="stars"></div>
    <div id="sun"></div>
    <div id="moon"></div>
  </div>
</div>

<div id="garden-label">庭</div>

<svg id="scene" viewBox="0 0 400 150" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="hillGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4d8a4a"/>
      <stop offset="100%" stop-color="#2f5c33"/>
    </linearGradient>
    <radialGradient id="soilGradient" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#6b4a34"/>
      <stop offset="100%" stop-color="#3f2c20"/>
    </radialGradient>
  </defs>

  <path id="hill"
    d="M -50,150 L -50,64 Q 60,40 200,54 Q 330,64 450,46 L 450,150 Z"/>

  <ellipse id="soil" cx="200" cy="58" rx="24" ry="7.5"/>

  <g id="sprout-outer" transform="translate(200,56) scale(0)">
    <g id="sprout-sway">
      <path d="M 0,0 C -1.5,-9 1.5,-15 0,-24"
        fill="none" stroke="#4c8f3f" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M 0,-16 C -8,-19 -13,-13 -14,-7 C -6,-9 -2,-12 0,-16 Z"
        fill="#5fa350"/>
      <path d="M 0,-19 C 8,-22 13,-16 14,-10 C 6,-12 2,-15 0,-19 Z"
        fill="#6cb85c"/>
    </g>
  </g>
</svg>

<div id="day-counter"></div>

<script>
(function () {
  "use strict";

  // この庭が植えられた日。ここを起点に経過日数を数える。
  var PLANTED_DATE = new Date(2026, 7, 25); // 2026-08-25 (月は0始まり)

  function daysSincePlanted() {
    var now = new Date();
    var a = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var b = new Date(PLANTED_DATE.getFullYear(), PLANTED_DATE.getMonth(), PLANTED_DATE.getDate());
    var diff = Math.round((a - b) / 86400000);
    return Math.max(0, diff) + 1; // 植えた日を1日目とする
  }

  function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
  function smooth(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }

  function hexToRgb(hex) {
    var n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function rgbToCss(rgb) { return "rgb(" + rgb.map(Math.round).join(",") + ")"; }
  function lerpColor(c1, c2, t) {
    var a = hexToRgb(c1), b = hexToRgb(c2);
    return rgbToCss([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]);
  }

  // 一日の空の色の変化(時刻: [上の色, 下の色])
  var SKY_KEYFRAMES = [
    { h: 0,    top: "#0b1026", bottom: "#1b2450" },
    { h: 5,    top: "#1c2a52", bottom: "#7a5a6a" },
    { h: 6.5,  top: "#5f86b0", bottom: "#f3ab6e" },
    { h: 9,    top: "#5fa3e0", bottom: "#cdeaff" },
    { h: 12,   top: "#4a9fe0", bottom: "#bfe4ff" },
    { h: 16,   top: "#4a86c8", bottom: "#e8c37a" },
    { h: 18,   top: "#33507f", bottom: "#f2905a" },
    { h: 19.5, top: "#1c2550", bottom: "#6a4a6f" },
    { h: 22,   top: "#0e1330", bottom: "#232a5c" },
    { h: 24,   top: "#0b1026", bottom: "#1b2450" }
  ];

  function skyColorsAt(hour) {
    for (var i = 0; i < SKY_KEYFRAMES.length - 1; i++) {
      var a = SKY_KEYFRAMES[i], b = SKY_KEYFRAMES[i + 1];
      if (hour >= a.h && hour <= b.h) {
        var t = (hour - a.h) / (b.h - a.h);
        return { top: lerpColor(a.top, b.top, t), bottom: lerpColor(a.bottom, b.bottom, t) };
      }
    }
    return { top: SKY_KEYFRAMES[0].top, bottom: SKY_KEYFRAMES[0].bottom };
  }

  // 昇る・沈むが真夜中をまたぐ天体(月・星)のための時刻シフト
  function shiftForNight(hour) { return hour < 12 ? hour + 24 : hour; }

  function fadeWindow(x, inStart, inEnd, outStart, outEnd) {
    if (x <= inStart || x >= outEnd) return 0;
    if (x >= inEnd && x <= outStart) return 1;
    if (x < inEnd) return smooth((x - inStart) / (inEnd - inStart));
    return smooth((outEnd - x) / (outEnd - outStart));
  }

  function arcPosition(progress) {
    // progress: 0(昇る)→1(沈む)。左から右へ弧を描く。
    var x = 8 + progress * 84;
    var y = 78 - Math.sin(Math.PI * progress) * 62;
    return { left: x + "%", top: y + "%" };
  }

  var starEls = [];
  function initStars() {
    var container = document.getElementById("stars");
    var count = 60;
    for (var i = 0; i < count; i++) {
      var s = document.createElement("div");
      s.className = "star";
      s.style.left = (Math.random() * 100) + "%";
      s.style.top = (Math.random() * 60) + "%";
      s.style.opacity = "0";
      var scale = 0.6 + Math.random() * 1.2;
      s.style.transform = "scale(" + scale.toFixed(2) + ")";
      container.appendChild(s);
      starEls.push(s);
    }
  }

  var skyEl, sunEl, moonEl, dayCounterEl, sproutOuter, sproutSway;

  function updateSky() {
    var now = new Date();
    var hour = now.getHours() + now.getMinutes() / 60;

    var colors = skyColorsAt(hour);
    skyEl.style.background = "linear-gradient(to bottom, " + colors.top + ", " + colors.bottom + ")";

    // 太陽: 5:30〜18:30 の間に見え、6:00〜18:00 の弧を描く
    var sunOpacity = fadeWindow(hour, 5.3, 6.0, 18.0, 18.7);
    var sunProgress = clamp((hour - 6) / 12, 0, 1);
    var sunPos = arcPosition(sunProgress);
    sunEl.style.opacity = sunOpacity;
    sunEl.style.left = sunPos.left;
    sunEl.style.top = sunPos.top;

    // 月・星: 18:00〜翌6:00 の間に見え、18:00〜30:00(=翌6:00) の弧を描く
    var nh = shiftForNight(hour);
    var moonOpacity = fadeWindow(nh, 17.7, 18.4, 29.6, 30.3);
    var moonProgress = clamp((nh - 18) / 12, 0, 1);
    var moonPos = arcPosition(moonProgress);
    moonEl.style.opacity = moonOpacity;
    moonEl.style.left = moonPos.left;
    moonEl.style.top = moonPos.top;

    updateStarsBase(hour);
  }

  function twinkle() {
    var t = Date.now() / 900;
    for (var i = 0; i < starEls.length; i++) {
      var base = parseFloat(starEls[i].dataset.base || "0");
      var flick = 0.75 + 0.25 * Math.sin(t + i);
      starEls[i].style.opacity = base * flick;
    }
    requestAnimationFrame(twinkle);
  }

  function updateStarsBase(hour) {
    var starOpacity = fadeWindow(shiftForNight(hour), 17.5, 19.0, 29.0, 30.5);
    for (var i = 0; i < starEls.length; i++) {
      starEls[i].dataset.base = starOpacity;
    }
  }

  function growSprout() {
    var day = daysSincePlanted();
    var scale = clamp(0.45 + Math.min(day - 1, 30) * (0.55 / 30), 0.45, 1.0);
    dayCounterEl.textContent = day + "日目";

    // 初回描画時にゆっくり芽吹かせる
    requestAnimationFrame(function () {
      sproutOuter.setAttribute("transform", "translate(200,56) scale(0)");
      sproutOuter.style.transition = "none";
      requestAnimationFrame(function () {
        sproutOuter.style.transition = "transform 2.2s cubic-bezier(0.2, 0.8, 0.2, 1)";
        sproutOuter.setAttribute("transform", "translate(200,56) scale(" + scale.toFixed(3) + ")");
      });
    });
  }

  function sway() {
    var t = Date.now() / 1800;
    var angle = Math.sin(t) * 3;
    sproutSway.setAttribute("transform", "rotate(" + angle.toFixed(2) + ")");
    requestAnimationFrame(sway);
  }

  document.addEventListener("DOMContentLoaded", function () {
    skyEl = document.getElementById("sky");
    sunEl = document.getElementById("sun");
    moonEl = document.getElementById("moon");
    dayCounterEl = document.getElementById("day-counter");
    sproutOuter = document.getElementById("sprout-outer");
    sproutSway = document.getElementById("sprout-sway");

    initStars();
    updateSky();
    setInterval(updateSky, 60000);

    growSprout();
    requestAnimationFrame(twinkle);
    requestAnimationFrame(sway);
  });
})();
</script>

</body>
</html>
